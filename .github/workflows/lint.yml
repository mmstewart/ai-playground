name: Lint

on:
    push:
    pull_request:

jobs:
    ruff:
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Run Ruff linter
              uses: astral-sh/ruff-action@v4.1.0

            - name: Run Ruff formatter check
              if: always()
              uses: astral-sh/ruff-action@v4.1.0
              with:
                  args: 'format --check'
